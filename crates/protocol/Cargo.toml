[package]
name = "coins-gsr-protocol"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
fixtures = ["dep:ark-bn254"]
accelerated = [
    "dep:ark-bn254",
    "dep:ark-ff",
    "dep:bn254_hash2curve",
    "dep:substrate-bn",
]

[dependencies]
coins-crypto.workspace = true
coins-types.workspace = true
serde.workspace = true
sha2.workspace = true
ark-bn254 = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
bn254_hash2curve = { version = "0.1.2", features = ["gnark_crypto_compatible"], optional = true }
substrate-bn = { package = "substrate-bn-succinct-rs", git = "https://github.com/sp1-patches/bn", rev = "717dbe5e2270940faa46b646c6b2d639c82fb949", optional = true }

[dev-dependencies]
ark-bn254 = "0.4"
hex = "0.4"
serde_json = "1"
